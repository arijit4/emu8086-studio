<svg
        width="1024"
        height="1024"
        viewBox="0 0 36 36"
        xmlns="http://www.w3.org/2000/svg"
>
    <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#10b981" stop-opacity="0.20"/>
            <stop offset="100%" stop-color="#000000" stop-opacity="1"/>
        </linearGradient>

        <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="3" result="blur"/>
            <feFlood flood-color="#10b981" flood-opacity="0.25"/>
            <feComposite in2="blur" operator="in"/>
            <feMerge>
                <feMergeNode/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>

    <rect
            x="0.5"
            y="0.5"
            width="35"
            height="35"
            rx="8"
            fill="url(#bg)"
            stroke="#34d399"
            stroke-opacity="0.30"
            filter="url(#glow)"
    />

    <g
            fill="none"
            stroke="#a7f3d0"
            stroke-width="1.6"
            stroke-linecap="round"
    >
        <rect x="9" y="9" width="18" height="18" rx="2.25"/>
        <rect x="14.1" y="14.1" width="7.8" height="7.8" rx="0.9"/>

        <path d="M13.5 4.2v4.8"/>
        <path d="M22.5 4.2v4.8"/>
        <path d="M13.5 27v4.8"/>
        <path d="M22.5 27v4.8"/>

        <path d="M4.2 13.5H9"/>
        <path d="M4.2 22.5H9"/>
        <path d="M27 13.5h4.8"/>
        <path d="M27 22.5h4.8"/>
    </g>
</svg>