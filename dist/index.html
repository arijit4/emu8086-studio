    MOV DL,AL
    MOV AH,2

.CODE
MAIN PROC
    MOV AX,@DATA
    MOV DS,AX

    XOR BX,BX       ; BX = accumulator
    MOV CX,10
SUMLOOP:
    ADD BX,CX
    LOOP SUMLOOP    ; BX = 1+2+...+10 = 55

    MOV AX,BX       ; print AX as decimal
    MOV BX,10
    XOR CX,CX       ; CX = digit count
PUSH_DIGITS:
    XOR DX,DX
    DIV BX          ; AX = quot, DX = remainder
    PUSH DX         ; save digit on the stack
    INC CX
    TEST AX,AX
    JNZ PUSH_DIGITS
PRINT_DIGITS:
    POP DX
    ADD DL,'0'
    MOV AH,2
    INT 21H
    LOOP PRINT_DIGITS

    MOV AH,9
    LEA DX,NL
    INT 21H

    MOV AH,4CH
    INT 21H
    MAIN ENDP
END MAIN

    INT 21H

    LEA DX,NL

    INT 21H

END MAIN
